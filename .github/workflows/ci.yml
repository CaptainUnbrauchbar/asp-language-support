name: CI

on:
    push:
        branches:
            - "*"
    pull_request:
        branches:
            - master

permissions:
    contents: read

jobs:
    ci:
        name: CI
        runs-on: ubuntu-latest
        outputs:
            vsixPath: ${{ steps.packageExtension.outputs.vsixPath }}
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
              with:
                  egress-policy: audit
                  #ToDo: Change to block after couple of workflow runs

            - name: Checkout Repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install Node 22
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22

            - name: Install Dependencies
              run: npm ci

            - name: Run Tests
              run: npm test

            - name: Package Extension
              id: packageExtension
              uses: HaaLeo/publish-vscode-extension@ca5561daa085dee804bf9f37fe0165785a9b14db # v2.0.0
              with:
                  # stub because this is a dry-run
                  pat: stub
                  # do not publish to marketplace, only package vsix
                  dryRun: true

            - name: Upload Extension Package as Artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: VSIX Extension File
                  path: ${{ steps.packageExtension.outputs.vsixPath }}
                  retention-days: 5

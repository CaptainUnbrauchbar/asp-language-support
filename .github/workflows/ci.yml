name: CI

on:
    push:
        branches:
            - "*"
    pull_request:
        branches:
            - master

permissions:
    contents: read

jobs:
    ci:
        name: CI
        runs-on: ubuntu-latest
        outputs:
            vsixPath: ${{ steps.packageExtension.outputs.vsixPath }}
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
              with:
                  egress-policy: audit
                  #ToDo: Change to block after couple of workflow runs

            - name: Checkout Repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install Node 22
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22

            - name: Install Dependencies
              run: npm ci

            - name: Run Tests
              run: npm test

            - name: Package Extension
              id: packageExtension
              uses: HaaLeo/publish-vscode-extension@1b8df468b849f76a143b8c18bf0ffa2075398d12 # v2.1.0
              with:
                  # stub because this is a dry-run
                  pat: stub
                  # do not publish to marketplace, only package vsix
                  dryRun: true

            - name: Upload Extension Package as Artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: VSIX Extension File
                  path: ${{ steps.packageExtension.outputs.vsixPath }}
                  retention-days: 5

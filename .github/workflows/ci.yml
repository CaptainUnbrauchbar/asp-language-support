name: CI

on:
    push:
        branches:
            - "*"
    pull_request:
        branches:
            - master

permissions:
    contents: read

jobs:
    ci:
        name: CI
        runs-on: ubuntu-latest
        outputs:
            vsixPath: ${{ steps.packageExtension.outputs.vsixPath }}
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
              with:
                  egress-policy: audit
                  #ToDo: Change to block after couple of workflow runs

            - name: Checkout Repository
              uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

            - name: Install Node 22
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
              with:
                  node-version: 22

            - name: Install Dependencies
              run: npm ci

            - name: Run Tests
              run: npm test

            - name: Package Extension
              id: packageExtension
              uses: HaaLeo/publish-vscode-extension@ca5561daa085dee804bf9f37fe0165785a9b14db # v2.0.0
              with:
                  # stub because this is a dry-run
                  pat: stub
                  # do not publish to marketplace, only package vsix
                  dryRun: true

            - name: Upload Extension Package as Artifact
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: VSIX Extension File
                  path: ${{ steps.packageExtension.outputs.vsixPath }}
                  retention-days: 5
